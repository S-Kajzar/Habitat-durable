<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Bahnschrift,'DIN Alternate','Roboto Condensed','Arial Narrow',Arial,sans-serif">
  <!-- Illustration de l'accueil : une maison et quelques leviers d'un habitat durable (charte du gabarit) -->
  <defs>
    <pattern id="isolant" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FCEFD8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B26A00" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="640" height="300" fill="#E6EEF8"/>
  <rect y="300" width="640" height="60" fill="#E2F1E7"/>
  <line x1="0" y1="300" x2="640" y2="300" stroke="#1C2530" stroke-width="2"/>

  <!-- soleil et rayonnement vers les panneaux -->
  <g stroke="#F2B705" stroke-width="4" stroke-linecap="round">
    <line x1="80" y1="22" x2="80" y2="34"/><line x1="80" y1="106" x2="80" y2="118"/>
    <line x1="32" y1="70" x2="44" y2="70"/><line x1="116" y1="70" x2="128" y2="70"/>
    <line x1="46" y1="36" x2="54" y2="44"/><line x1="106" y1="96" x2="114" y2="104"/>
    <line x1="46" y1="104" x2="54" y2="96"/><line x1="106" y1="44" x2="114" y2="36"/>
  </g>
  <circle cx="80" cy="70" r="26" fill="#F2B705"/>
  <g stroke="#F2B705" stroke-width="2.5" stroke-dasharray="7 6" fill="none">
    <path d="M118 92 L238 150"/><path d="M122 78 L282 122"/>
  </g>

  <!-- nuage et pluie -->
  <g fill="#FFFFFF" stroke="#46525C" stroke-width="2">
    <path d="M520 86 a20 20 0 0 1 8-38 a26 26 0 0 1 48-6 a18 18 0 0 1 22 22 a16 16 0 0 1-4 22 z"/>
  </g>
  <g stroke="#1F5FA8" stroke-width="2.5" stroke-linecap="round">
    <line x1="534" y1="98" x2="528" y2="112"/><line x1="556" y1="98" x2="550" y2="112"/>
    <line x1="578" y1="98" x2="572" y2="112"/><line x1="545" y1="120" x2="539" y2="134"/>
    <line x1="567" y1="120" x2="561" y2="134"/>
  </g>

  <!-- arbre : ombre l'été, laisse passer le soleil l'hiver -->
  <rect x="150" y="226" width="11" height="74" fill="#7A5230"/>
  <g fill="#1B7A43">
    <circle cx="155" cy="208" r="34"/><circle cx="130" cy="232" r="22"/><circle cx="182" cy="230" r="23"/>
  </g>

  <!-- maison : murs isolés par l'extérieur -->
  <rect x="230" y="170" width="240" height="130" fill="url(#isolant)" stroke="#1C2530" stroke-width="2.5"/>
  <rect x="243" y="183" width="214" height="117" fill="#FFFFFF" stroke="#1C2530" stroke-width="1.5"/>
  <!-- toiture et panneaux photovoltaïques sur le pan au soleil -->
  <polygon points="214,174 350,82 486,174" fill="#1C2530"/>
  <g transform="translate(214 174) rotate(-34.07)">
    <rect x="30" y="5" width="110" height="22" fill="#1F5FA8" stroke="#FFFFFF" stroke-width="1.5"/>
    <g stroke="#FFFFFF" stroke-width="1">
      <line x1="52" y1="5" x2="52" y2="27"/><line x1="74" y1="5" x2="74" y2="27"/>
      <line x1="96" y1="5" x2="96" y2="27"/><line x1="118" y1="5" x2="118" y2="27"/>
      <line x1="30" y1="16" x2="140" y2="16"/>
    </g>
  </g>
  <!-- fenêtre à triple vitrage, porte -->
  <rect x="268" y="204" width="64" height="52" fill="#E6EEF8" stroke="#1C2530" stroke-width="3"/>
  <g stroke="#1C2530" stroke-width="1.2"><line x1="300" y1="204" x2="300" y2="256"/>
    <line x1="296" y1="206" x2="296" y2="254"/><line x1="304" y1="206" x2="304" y2="254"/></g>
  <rect x="372" y="226" width="42" height="74" fill="#B26A00" stroke="#1C2530" stroke-width="2"/>
  <circle cx="405" cy="266" r="3" fill="#F2B705"/>
  <!-- gouttière, descente et cuve de récupération -->
  <path d="M470 176 H492 V238" fill="none" stroke="#46525C" stroke-width="5" stroke-linejoin="round"/>
  <rect x="478" y="238" width="62" height="62" rx="6" fill="#FFFFFF" stroke="#1F5FA8" stroke-width="2.5"/>
  <rect x="480" y="262" width="58" height="36" rx="4" fill="#1F5FA8" opacity=".55"/>

  <!-- étiquettes -->
  <line x1="262" y1="70" x2="284" y2="124" stroke="#1C2530" stroke-width="2"/>
  <g font-size="18" font-weight="700" fill="#1C2530" text-anchor="middle">
    <rect x="186" y="44" width="152" height="26" fill="#F2B705"/><text x="262" y="63">Énergie solaire</text>
    <rect x="100" y="312" width="112" height="26" fill="#F2B705"/><text x="156" y="331">Végétation</text>
    <rect x="222" y="312" width="96" height="26" fill="#F2B705"/><text x="270" y="331">Isolation</text>
    <rect x="463" y="312" width="126" height="26" fill="#F2B705"/><text x="526" y="331">Eau de pluie</text>
  </g>
</svg>
